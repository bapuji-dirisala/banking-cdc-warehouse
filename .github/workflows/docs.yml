name: docs

# Phase 12 — build and publish the dbt docs site to GitHub Pages on every
# push to main. The published site is the hosted lineage browser —
# column-level DAG, exposures with owner contacts, metric definitions,
# source freshness checks, test coverage.
#
# One-time setup required in the repo UI:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The first successful run after that flip starts serving at
#   https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}
  cancel-in-progress: false   # NEVER cancel a deploy mid-upload

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    name: dbt docs generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dbt + warehouse extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,warehouse,dbt]"

      - name: seed raw schema + fixture
        run: python scripts/seed-duckdb-fixture.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt docs generate
        working-directory: dbt
        run: |
          # Build first so test + run results populate the docs with
          # real pass/fail / rowcount annotations.
          dbt build --profiles-dir . --target dev --fail-fast
          # `dbt docs generate` writes manifest.json, catalog.json, and
          # the pre-rendered index.html into target/.
          dbt docs generate --profiles-dir . --target dev

      # dbt's docs runner expects to fetch manifest.json + catalog.json
      # at page load. Inlining them into index.html makes the site a
      # single-file static deployable — no CORS fiddling, survives
      # strict CSP browsers. Logic lives in a reviewable script so
      # linters catch bugs; the workflow is just the invocation.
      - name: assemble single-file docs site/
        run: python scripts/dbt-docs-inline.py --target dbt/target --out site

      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
