name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves runner minutes and
# keeps the "latest push" the source of truth for PR checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Unit tests import from banking_cdc.oltp / .seed which need the
      # ``postgres`` extra (SQLAlchemy, psycopg, Faker) even though they
      # don't hit a real database. Extend this list as future phases add
      # their own extras (``kafka``, ``snowflake``, ``dbt``, …).
      - name: install package with dev + runtime extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      # Integration + warehouse tests are deselected by default via the
      # pyproject marker filter — they need Postgres / Kafka / Snowflake.
      # To exercise them, add a separate job with the appropriate service
      # containers and ``pytest -m integration`` or ``pytest -m warehouse``.
      - name: pytest
        run: pytest -q

  dbt-duckdb:
    name: dbt build (duckdb)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install dbt + warehouse extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,warehouse,dbt]"

      - name: seed raw schema + fixture into duckdb
        run: python scripts/seed-duckdb-fixture.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: dbt build (dev target)
        working-directory: dbt
        run: dbt build --profiles-dir . --target dev --fail-fast

      # Phase 11 — on main-branch builds only, publish the resulting
      # manifest as a workflow artifact. The PR-lineage workflow
      # (.github/workflows/pr-lineage.yml) downloads it to drive
      # `--defer --state:modified+` so a PR build only materialises
      # changed-and-descendant models.
      - name: upload baseline manifest (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest-main
          path: dbt/target/manifest.json
          retention-days: 14
