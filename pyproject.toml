[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-cdc-warehouse"
version = "0.1.0"
description = "Regulatory-grade banking CDC warehouse: Postgres OLTP → Debezium → Kafka → Snowflake, modelled in dbt with SCD2 dims, GE quality gates, and audit trails."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Bapuji Dirisala", email = "dirisala.bapuji@gmail.com" },
]
keywords = [
    "data-engineering",
    "cdc",
    "debezium",
    "kafka",
    "snowflake",
    "dbt",
    "banking",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# Phase 1 — Postgres OLTP source + synthetic transaction generator.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "faker>=27.0",
]
# Phase 2 — Kafka Connect REST client for the ``banking-cdc kafka ...`` CLI
# and the Phase 2 CDC smoke test. Deliberately lightweight: just ``requests``.
# A full Kafka client (kafka-python / confluent-kafka) is scoped to the
# ``warehouse`` extra below, because only the sink needs it.
kafka = [
    "requests>=2.31",
]
# Phase 3 — DuckDB sink for Debezium CDC + local dev warehouse. The Snowflake
# side of this project ships as code only (see ``snowflake/``) so no
# Snowflake Python dependencies are required here. A production reader
# swapping to the Snowflake Kafka Connector would additionally install
# dbt-snowflake / snowflake-connector-python in Phase 4+.
warehouse = [
    "duckdb>=0.10",
    "kafka-python>=2.0",
]

[project.scripts]
banking-cdc = "banking_cdc.cli:main"

[project.urls]
Repository = "https://github.com/bapuji-dirisala/banking-cdc-warehouse"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_cdc"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Deselect infra-dependent tests by default. Opt in per marker once the
# relevant fixtures are up (compose stack / Snowflake trial / etc.).
addopts = "-v --strict-markers -m 'not integration and not cdc and not warehouse'"
markers = [
    "integration: requires the Phase 1 Postgres container running",
    "cdc: requires the full Phase 2 stack (Postgres + Kafka + Connect) running and the Debezium connector registered",
    "warehouse: hits a real Snowflake / BigQuery warehouse",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "warehouse", "notebooks", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
