name: banking_cdc
version: 1.0.0
config-version: 2

# Points at profiles.yml:banking_cdc. The committed profile uses env_var()
# for every Snowflake-side credential, so this file is safe to version.
profile: banking_cdc

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Project-wide defaults, overridden per layer below.
models:
  banking_cdc:
    # Phase 4 — staging. Views keep the dev inner loop fast on DuckDB;
    # on Snowflake prod we'd override to `table` in a future phase if
    # downstream intermediate models get expensive to re-scan.
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#9FD2CB"

# Phase 4 only ships staging. Intermediate / marts land in P5+.