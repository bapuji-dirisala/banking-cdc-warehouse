name: banking_cdc
version: 1.0.0
config-version: 2

# Points at profiles.yml:banking_cdc. The committed profile uses env_var()
# for every Snowflake-side credential, so this file is safe to version.
profile: banking_cdc

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Phase 6 — SCD2 history via dbt snapshots over the staging layer. The
# snapshot table itself IS the SCD2 — dbt adds dbt_valid_from /
# dbt_valid_to / dbt_scd_id columns. Thin SCD2 dim views in marts/core
# alias those to business-friendly names.
snapshots:
  banking_cdc:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at
    +invalidate_hard_deletes: true

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Project-wide defaults, overridden per layer below.
models:
  banking_cdc:
    # Phase 4 — staging. Views keep the dev inner loop fast on DuckDB;
    # on Snowflake prod we'd override to `table` in a future phase if
    # downstream intermediate models get expensive to re-scan.
    staging:
      +materialized: view
      +schema: staging
      +docs:
        node_color: "#9FD2CB"

    # Phase 5 — intermediate. Ephemeral by default: these get inlined as
    # CTEs into their downstream mart, which keeps the warehouse clean of
    # one-off joined-and-decoded shapes nobody queries directly.
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +docs:
        node_color: "#C9ADA7"

    # Phase 5 — marts. Materialized as tables because these are the
    # pay-once-read-many layer serving dashboards + exports. The two
    # sub-folders are the standard "core star-schema" vs "business
    # subject area" split; P5 only ships one subject area (finance),
    # P9+ will add risk, operations, etc.
    marts:
      +materialized: table
      +schema: marts
      core:
        +docs:
          node_color: "#A6E3A1"
      finance:
        +docs:
          node_color: "#F9E2AF"