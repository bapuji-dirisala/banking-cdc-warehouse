# Keep the package graph small on purpose:
#
# - dbt_utils  — surrogate-key, date_spine, unique_combination_of_columns, etc.
# - dbt_expectations (Phase 9) — Great-Expectations-style assertions
#   (sum-range, regex, row-count-equals-other-table) that live inside
#   `dbt build` rather than needing a parallel GE install.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<1.0.0"]
